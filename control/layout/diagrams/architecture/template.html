<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — Architecture Decision</title>
<link rel="stylesheet" href="../_shared/diagram.css">
</head>
<body class="mc-diagram">

<div class="mc-diagram-container">

  <h1 class="mc-diagram-title">{{TITLE}}</h1>
  <p class="mc-diagram-subtitle">{{SUBTITLE}}</p>

  <div class="mc-section-label">{{SECTION_LABEL}}</div>

  <!--
    data-group:    a stable decision ID (becomes the "id" field in
                   the canonical decisions schema, e.g. "data-architecture").
    data-category: optional ("engineering" | "ui" | "ux").
    data-question: optional human-readable question for hydration.
  -->
  <div class="mc-options-grid"
       data-group="{{GROUP_ID}}"
       data-category="engineering"
       data-question="{{QUESTION}}">

    <!-- ================== OPTION 1 ================== -->
    <div class="mc-option-card selected" data-value="{{OPTION_1_ID}}">
      <div class="mc-card-tooltip">{{OPTION_1_TOOLTIP}}</div>
      <span class="mc-checkmark" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
          <path d="M3 7.5L5.5 10L11 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>

      <!-- PLACEHOLDER:OPTION_1_DIAGRAM
           Replace this surface with an SVG (or DIV-based) architecture diagram.
           Use .mc-arch-node and .mc-arch-arrow utility classes for consistency.
      -->
      <div class="mc-diagram-surface">
        <div class="mc-arch-node accent">App</div>
        <div class="mc-arch-arrow"><div class="line"></div><span class="label">queries</span></div>
        <div class="mc-arch-node green">PostgreSQL</div>
      </div>

      <div class="mc-card-label">{{OPTION_1_LABEL}}</div>
      <div class="mc-card-desc">{{OPTION_1_DESC}}</div>
    </div>

    <!-- ================== OPTION 2 ================== -->
    <div class="mc-option-card" data-value="{{OPTION_2_ID}}">
      <div class="mc-card-tooltip">{{OPTION_2_TOOLTIP}}</div>
      <span class="mc-checkmark" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
          <path d="M3 7.5L5.5 10L11 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>

      <!-- PLACEHOLDER:OPTION_2_DIAGRAM -->
      <div class="mc-diagram-surface">
        <svg width="200" height="120" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g fill="none" stroke="#444" stroke-width="2">
            <line x1="40"  y1="40" x2="100" y2="70"/>
            <line x1="100" y1="40" x2="100" y2="70"/>
            <line x1="160" y1="40" x2="100" y2="70"/>
            <line x1="100" y1="80" x2="60"  y2="105"/>
            <line x1="100" y1="80" x2="140" y2="105"/>
          </g>
          <g font-family="system-ui, sans-serif" font-size="10" fill="#bbb" text-anchor="middle">
            <rect x="10"  y="22" width="60" height="22" rx="4" fill="#1e1e1e" stroke="#444"/>
            <text  x="40"  y="37">Auth</text>
            <rect x="70"  y="22" width="60" height="22" rx="4" fill="#1e1e1e" stroke="#444"/>
            <text  x="100" y="37">API</text>
            <rect x="130" y="22" width="60" height="22" rx="4" fill="#1e1e1e" stroke="#444"/>
            <text  x="160" y="37">Worker</text>

            <rect x="40" y="70" width="120" height="18" rx="4" fill="#2a1a2a" stroke="#8a6aaf"/>
            <text  x="100" y="83" fill="#c5b4d4">Event Bus</text>

            <rect x="30" y="98" width="60" height="20" rx="4" fill="#1e1e1e" stroke="#af6a6a"/>
            <text  x="60" y="112" fill="#d4a1a1">Redis</text>
            <rect x="110" y="98" width="60" height="20" rx="4" fill="#1e1e1e" stroke="#5a9a6a"/>
            <text  x="140" y="112" fill="#b9d4be">Postgres</text>
          </g>
        </svg>
      </div>

      <div class="mc-card-label">{{OPTION_2_LABEL}}</div>
      <div class="mc-card-desc">{{OPTION_2_DESC}}</div>
    </div>

    <!-- ================== OPTION 3 ================== -->
    <div class="mc-option-card" data-value="{{OPTION_3_ID}}">
      <div class="mc-card-tooltip">{{OPTION_3_TOOLTIP}}</div>
      <span class="mc-checkmark" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
          <path d="M3 7.5L5.5 10L11 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>

      <!-- PLACEHOLDER:OPTION_3_DIAGRAM -->
      <div class="mc-diagram-surface">
        <svg width="200" height="120" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g fill="none" stroke="#444" stroke-width="2">
            <line x1="100" y1="22" x2="100" y2="42"/>
            <line x1="100" y1="62" x2="40"  y2="82"/>
            <line x1="100" y1="62" x2="100" y2="82"/>
            <line x1="100" y1="62" x2="160" y2="82"/>
            <line x1="100" y1="100" x2="100" y2="115"/>
          </g>
          <g font-family="system-ui, sans-serif" font-size="10" fill="#bbb" text-anchor="middle">
            <rect x="70" y="2" width="60" height="20" rx="4" fill="#1e1e1e" stroke="#af8c6a"/>
            <text  x="100" y="16" fill="#d4bba1">CDN</text>
            <rect x="50" y="42" width="100" height="20" rx="10" fill="#1a1a2a" stroke="#6a8caf"/>
            <text  x="100" y="56" fill="#6a8caf">Functions</text>
            <rect x="10"  y="80" width="60" height="20" rx="4" fill="#1e1e1e" stroke="#444"/>
            <text  x="40"  y="94">Auth</text>
            <rect x="70"  y="80" width="60" height="20" rx="4" fill="#1e1e1e" stroke="#444"/>
            <text  x="100" y="94">Store</text>
            <rect x="130" y="80" width="60" height="20" rx="4" fill="#1e1e1e" stroke="#444"/>
            <text  x="160" y="94">Queue</text>
          </g>
        </svg>
      </div>

      <div class="mc-card-label">{{OPTION_3_LABEL}}</div>
      <div class="mc-card-desc">{{OPTION_3_DESC}}</div>
    </div>

    <!-- ================== OPTION 4 (optional) ================== -->
    <!-- PLACEHOLDER:OPTION_4
         Duplicate an option block above if you need a fourth choice.
         Otherwise delete this comment and bump grid to data-cols="3".
    -->

  </div>

  <div class="mc-save-bar">
    <button class="mc-save-btn" data-mc-save type="button">Save Decision</button>
  </div>

</div>

<div class="mc-toast" id="mc-toast"></div>

<script src="../_shared/diagram-select.js"></script>
<script src="../_shared/decisions-client.js"></script>
<script>
  (function () {
    // {{SLUG}} — replace with the feature slug at render time.
    var SLUG = '{{SLUG}}';
    var toast = document.getElementById('mc-toast');

    function showToast(msg, isError) {
      toast.innerHTML = '<span class="check">✓</span>' + msg;
      toast.classList.toggle('error', !!isError);
      toast.classList.add('visible');
      setTimeout(function () { toast.classList.remove('visible'); }, 3500);
    }

    MCDiagramSelect.onSave(function (selections) {
      // Standalone preview: don't POST if slug is still the placeholder.
      if (!SLUG || SLUG.indexOf('{{') === 0) {
        showToast('Preview save — selections: ' + JSON.stringify(selections));
        return;
      }
      MCDecisions.save(SLUG, { decisions: selections })
        .then(function () { showToast('Decision saved.'); })
        .catch(function (err) { showToast(err.message, true); });
    });
  }());
</script>

</body>
</html>
