<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Skeleton — iOS Hamburger</title>
  <link rel="stylesheet" href="../wireframe.css" />
</head>
<body>
<div class="wf-phone wf-stack">
  <div class="wf-bar">
    <span class="wf-btn" style="padding:4px 10px">☰</span>
    <span class="wf-label">Nav bar</span>
    <span style="margin-left:auto;font-weight:600">Title</span>
  </div>
  <main class="wf-main" style="flex:1">
    <span class="wf-label">Content</span>
    <div class="wf-region" style="margin-top:12px;min-height:560px">
      <div class="wf-slot">Screen body — menu opens as sheet or push</div>
    </div>
  </main>
</div>
<!-- Drawer state: duplicate page with left sheet overlay for layout variant -->
</body>
</html>
