<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Skeleton — Web SaaS</title>
  <link rel="stylesheet" href="../wireframe.css" />
</head>
<body>
<div class="wf-page wf-desktop">
  <div class="wf-bar wf-bar-dark">
    <span class="wf-label" style="background:#444;color:#fff">Top bar</span>
    <span style="margin-left:auto" class="wf-nav-item">Account</span>
  </div>
  <div class="wf-row">
    <aside class="wf-sidebar">
      <span class="wf-label">Sidebar nav</span>
      <div style="margin-top:28px;display:flex;flex-direction:column;gap:6px">
        <div class="wf-nav-item wf-nav-item-active">Dashboard</div>
        <div class="wf-nav-item">Projects</div>
        <div class="wf-nav-item">Settings</div>
      </div>
    </aside>
    <main class="wf-main">
      <span class="wf-label">Main content</span>
      <div class="wf-region wf-region-body" style="margin-top:12px;min-height:400px">
        <div class="wf-slot">Page header + primary content area</div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
