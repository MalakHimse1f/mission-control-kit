<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Skeleton — Desktop Windows</title>
  <link rel="stylesheet" href="../wireframe.css" />
</head>
<body>
<div class="wf-page wf-desktop">
  <div class="wf-bar">
    <span class="wf-label">Title bar</span>
    <span style="margin-left:12px;font-weight:600">App name</span>
    <span style="margin-left:auto;display:flex;gap:4px">
      <span class="wf-nav-item" style="padding:2px 8px">—</span>
      <span class="wf-nav-item" style="padding:2px 8px">□</span>
      <span class="wf-nav-item" style="padding:2px 8px">×</span>
    </span>
  </div>
  <div class="wf-bar" style="background:#f0f0f0;border-top:none;font-size:12px">
    <span class="wf-label">Ribbon / toolbar</span>
    <span style="margin-left:12px" class="wf-btn">Home</span>
    <span class="wf-btn">Insert</span>
  </div>
  <div class="wf-row">
    <aside class="wf-sidebar">
      <span class="wf-label">Nav tree</span>
      <div style="margin-top:28px" class="wf-slot">Tree view</div>
    </aside>
    <main class="wf-main">
      <span class="wf-label">Content area</span>
      <div class="wf-region" style="margin-top:12px;min-height:400px">
        <div class="wf-slot">Main panel</div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
