<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Skeleton — iOS Tab Nav</title>
  <link rel="stylesheet" href="../wireframe.css" />
</head>
<body>
<div class="wf-phone wf-stack">
  <div class="wf-bar">
    <span class="wf-label">Nav bar</span>
    <span style="margin-left:auto;font-weight:600">Title</span>
  </div>
  <main class="wf-main" style="flex:1">
    <span class="wf-label">Content</span>
    <div class="wf-region" style="margin-top:12px;min-height:520px">
      <div class="wf-slot">Screen body</div>
    </div>
  </main>
  <nav class="wf-tab-bar">
    <div class="wf-tab wf-tab-active">Tab 1</div>
    <div class="wf-tab">Tab 2</div>
    <div class="wf-tab">Tab 3</div>
    <div class="wf-tab">Tab 4</div>
  </nav>
</div>
</body>
</html>
