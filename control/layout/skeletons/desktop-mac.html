<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Skeleton — Desktop Mac</title>
  <link rel="stylesheet" href="../wireframe.css" />
</head>
<body>
<div class="wf-page wf-desktop">
  <div class="wf-bar" style="background:#ddd;font-size:12px">
    <span class="wf-dot wf-dot-close"></span><span class="wf-dot"></span><span class="wf-dot"></span>
    <span class="wf-label" style="margin-left:8px">Menu bar</span>
    <span style="margin-left:16px">App</span><span style="margin-left:12px">File</span><span style="margin-left:12px">Edit</span>
  </div>
  <div class="wf-row">
    <aside class="wf-sidebar" style="width:220px">
      <span class="wf-label">Source list / sidebar</span>
      <div style="margin-top:28px" class="wf-slot">Navigation list</div>
    </aside>
    <main class="wf-main">
      <span class="wf-label">Document / detail pane</span>
      <div class="wf-region" style="margin-top:12px;min-height:420px">
        <div class="wf-slot">Primary workspace</div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
