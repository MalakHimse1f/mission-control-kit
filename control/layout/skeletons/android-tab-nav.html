<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Skeleton — Android Tab Nav</title>
  <link rel="stylesheet" href="../wireframe.css" />
</head>
<body>
<div class="wf-phone wf-stack">
  <div class="wf-bar wf-bar-dark">
    <span class="wf-label" style="background:#444;color:#fff">App bar</span>
    <span style="margin-left:12px;color:#fff;font-weight:600">Title</span>
  </div>
  <main class="wf-main" style="flex:1">
    <span class="wf-label">Content</span>
    <div class="wf-region" style="margin-top:12px;min-height:520px">
      <div class="wf-slot">Screen body</div>
    </div>
  </main>
  <nav class="wf-tab-bar" style="background:#fff">
    <div class="wf-tab wf-tab-active">Home</div>
    <div class="wf-tab">Search</div>
    <div class="wf-tab">Profile</div>
  </nav>
</div>
</body>
</html>
