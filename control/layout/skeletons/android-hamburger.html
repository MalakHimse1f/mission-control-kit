<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Skeleton — Android Hamburger</title>
  <link rel="stylesheet" href="../wireframe.css" />
</head>
<body>
<div class="wf-phone wf-stack">
  <div class="wf-bar wf-bar-dark">
    <span class="wf-btn" style="padding:4px 10px;background:#444;color:#fff;border-color:#666">☰</span>
    <span class="wf-label" style="background:#444;color:#fff">App bar</span>
    <span style="margin-left:8px;color:#fff;font-weight:600">Title</span>
  </div>
  <main class="wf-main" style="flex:1">
    <span class="wf-label">Content</span>
    <div class="wf-region" style="margin-top:12px;min-height:560px">
      <div class="wf-slot">Screen body — nav drawer from left</div>
    </div>
  </main>
</div>
</body>
</html>
