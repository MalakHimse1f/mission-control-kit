<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Skeleton — Web Marketing / Landing</title>
  <link rel="stylesheet" href="../wireframe.css" />
</head>
<body>
<div class="wf-page wf-desktop">
  <div class="wf-bar">
    <span class="wf-label">Header nav</span>
    <span style="margin-left:24px" class="wf-nav-item">Product</span>
    <span class="wf-nav-item">Pricing</span>
    <span style="margin-left:auto" class="wf-btn wf-btn-primary">Sign up</span>
  </div>
  <section class="wf-hero">
    <span class="wf-label">Hero</span>
    <h1 style="margin-top:16px">Headline + value prop</h1>
    <p>Supporting line</p>
    <div style="margin-top:16px"><span class="wf-btn wf-btn-primary">Primary CTA</span></div>
  </section>
  <div style="padding:24px">
    <span class="wf-label">Sections</span>
    <div class="wf-grid-3" style="margin-top:12px">
      <div class="wf-card wf-slot">Feature 1</div>
      <div class="wf-card wf-slot">Feature 2</div>
      <div class="wf-card wf-slot">Feature 3</div>
    </div>
  </div>
  <div class="wf-bar" style="border-top:2px solid #111;border-bottom:none">
    <span class="wf-label">Footer</span>
  </div>
</div>
</body>
</html>
